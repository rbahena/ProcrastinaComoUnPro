<!-- HEADER -->
<header class="landing-header">
  <a routerLink="/landing" class="logo" style="padding: 0; text-decoration: none; display: flex; align-items: center; gap: 8px;">
    <span class="logo-icon"><i class="fa-solid fa-yin-yang" style="color: var(--accent);"></i></span>
    <span class="logo-text">COFU</span>
  </a>
  <div style="display: flex; gap: 10px; align-items: center;">
    <a routerLink="/login">
      <button class="btn btn-ghost btn-sm">Iniciar sesión</button>
    </a>
    <a routerLink="/registro">
      <button class="btn btn-accent btn-sm">Registrarte</button>
    </a>
  </div>
</header>

<div class="auth-container">

  <div class="auth-card">
    <div class="auth-header">
      <h2 class="auth-title">Crear una cuenta</h2>
      <p class="auth-subtitle">Crea tu cuenta de acceso gratuito para comenzar</p>
    </div>

    @if (registroError()) {
      <div style="background: rgba(248, 113, 113, 0.08); border: 1px solid rgba(248, 113, 113, 0.2); border-radius: 8px; padding: 12px; margin-bottom: 18px; color: var(--red); font-size: 12.5px; text-align: center; font-weight: 500;">
        {{ registroError() }}
      </div>
    }

    <!-- Main Form -->
    <form (submit)="onSubmit($event, emailInput.value, passwordInput.value)" class="auth-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input #emailInput type="email" id="email" placeholder="nombre@ejemplo.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input #passwordInput type="password" id="password" placeholder="Mínimo 8 caracteres" required autocomplete="new-password">
      </div>

      <button type="submit" class="btn btn-accent w-100" style="margin-top: 15px;">
        Registrarse
      </button>

      <p class="terms-disclaimer" style="text-align: center; font-size: 11px; margin-top: 14px; line-height: 1.4; color: var(--muted);">
        Al registrarte, confirmas que aceptas nuestros Términos de Servicio y la Política de Privacidad.
      </p>
    </form>

    <div class="divider" style="display: flex; align-items: center; text-align: center; margin: 20px 0; color: var(--muted); font-size: 12px;">
      <span style="flex: 1; border-bottom: 1px solid var(--border); margin-right: 10px;"></span>
      <span>o bien</span>
      <span style="flex: 1; border-bottom: 1px solid var(--border); margin-left: 10px;"></span>
    </div>

    <!-- Google Button -->
    <button class="google-btn" (click)="registerWithGoogle()" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: var(--r); color: var(--text); font-weight: 500; cursor: pointer; transition: background 0.2s;">
      <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.56-2.77c-.98.66-2.23 1.06-3.72 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
      </svg>
      Registrarse con Google
    </button>

    <div class="auth-footer" style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted);">
      ¿Ya tienes una cuenta registrada? <a routerLink="/login" style="color: var(--accent); text-decoration: none; font-weight: 500;">Inicia sesión</a>
    </div>
  </div>
</div>
