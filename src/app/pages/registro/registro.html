<!-- HEADER -->
<header class="landing-header">
  <a routerLink="/landing" class="logo" style="padding: 0; text-decoration: none; display: flex; align-items: center; gap: 8px;">
    <span class="logo-icon"><i class="fa-solid fa-bolt"></i></span>
    <span class="logo-text">Procrastina como un Pro</span>
  </a>
  <div style="display: flex; gap: 10px; align-items: center;">
    <a routerLink="/login">
      <button class="btn btn-ghost btn-sm">Iniciar sesión</button>
    </a>
    <a routerLink="/registro">
      <button class="btn btn-accent btn-sm">Registrarte</button>
    </a>
  </div>
</header>

<div class="auth-container">

  <div class="auth-card">
    <div class="auth-header">
      <h2 class="auth-title">Crear cuenta</h2>
      <p class="auth-subtitle">Crea tu cuenta de acceso gratis e inicia hoy</p>
    </div>

    <!-- Main Form -->
    <form (submit)="onSubmit($event)" class="auth-form">
      <div class="form-group">
        <label for="name">Nombre Completo</label>
        <input type="text" id="name" placeholder="Tu nombre" required autocomplete="name">
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="nombre@ejemplo.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Mínimo 8 caracteres" required autocomplete="new-password">
      </div>

      <button type="submit" class="btn btn-accent w-100" style="margin-top: 15px;">
        Crear cuenta
      </button>

      <p class="terms-disclaimer">
        Al crear tu cuenta, aceptas nuestros Términos de Servicio y la Política de Privacidad.
      </p>
    </form>

    <div class="auth-footer">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </div>
  </div>
</div>
