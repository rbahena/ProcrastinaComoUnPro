<!-- SIDEBAR -->
<div class="sidebar" [class.collapsed]="sidebarCollapsed()">
  <!-- Toggle Sidebar Button -->
  <button (click)="toggleSidebar()" 
          class="sidebar-toggle-btn"
          [title]="sidebarCollapsed() ? 'Expandir barra lateral' : 'Contraer barra lateral'">
    <i class="fa-solid" [class]="sidebarCollapsed() ? 'fa-angles-right' : 'fa-angles-left'" style="font-size: 11px;"></i>
  </button>
  <a routerLink="/home" class="logo">
    <img class="logo-img" src="assets/images/cofu_logo.jpg" alt="COFU Logo">
    <span class="logo-text">{{ labels().logoText }}</span>
  </a>
  <div class="nav">
    <a routerLink="/home" routerLinkActive="active" class="nav-item">
      <span class="nav-dot"></span>
      Inicio
    </a>
    <a routerLink="/enfoque" routerLinkActive="active" class="nav-item">
      <span class="nav-dot"></span>
      Concentrarme
    </a>
    <a routerLink="/fechas" routerLinkActive="active" class="nav-item">
      <span class="nav-dot"></span>
      estadisticas
    </a>
    <a routerLink="/ideas" routerLinkActive="active" class="nav-item">
      <span class="nav-dot"></span>
      ideas
      <span *ngIf="membership.capturedIdeas().length > 0" class="ideas-badge">
        {{ membership.capturedIdeas().length }}
      </span>
    </a>
    <a routerLink="/bestiario" routerLinkActive="active" class="nav-item">
      <span class="nav-dot"></span>
      Retos
    </a>
    <a routerLink="/medallero" routerLinkActive="active" class="nav-item">
      <span class="nav-dot"></span>
      Hazañas
    </a>
  </div>
    
    <!-- CONTENEDOR DE PERFIL CON MENU DESPLEGABLE -->
    <div style="position: relative; z-index: 1010;">
      <div class="sidebar-footer" (click)="membership.toggleAvatarMenu($event)" style="cursor: pointer;">
        <div [class]="'avatar avatar-sprite sprite-' + membership.selectedAvatar()" style="background-color: var(--accent); border: 1.5px solid rgba(255,255,255,0.08);">
        </div>
        <div style="overflow: hidden; display: flex; flex-direction: column;">
          <div class="user-name" style="text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">{{ userName() }}</div>
          <div class="user-sub" style="text-overflow: ellipsis; overflow: hidden; white-space: nowrap; color: var(--yellow);">
            {{ getAvatarName() }}
          </div>
        </div>
        <i class="fa-solid" [class]="membership.avatarMenuOpen() ? 'fa-chevron-up' : 'fa-chevron-down'" style="margin-left: auto; font-size: 11px; color: var(--muted); opacity: 0.65; padding-right: 4px;"></i>
      </div>

      <!-- Menú Desplegable -->
      <div *ngIf="membership.avatarMenuOpen()"
           style="position: absolute; top: 48px; right: 0; background: rgba(15, 15, 20, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 12px; width: 160px; padding: 6px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 1020;">
        <a routerLink="/cualidades" (click)="membership.closeAvatarMenu()"
           style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--text); transition: all 0.2s;"
           onmouseover="this.style.background='rgba(255,255,255,0.06)'; this.style.color='var(--accent)';"
           onmouseout="this.style.background='transparent'; this.style.color='var(--text)';">
          <i class="fa-solid fa-user" style="font-size: 11px; width: 14px; text-align: center;"></i>
          <span>Mi Perfil</span>
        </a>
        <div style="height: 1px; background: rgba(255,255,255,0.06); margin: 4px 6px;"></div>
        <a routerLink="/login" (click)="membership.closeAvatarMenu()"
           style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; color: #f87171; transition: all 0.2s;"
           onmouseover="this.style.background='rgba(239, 68, 68, 0.08)';"
           onmouseout="this.style.background='transparent';">
          <i class="fa-solid fa-right-from-bracket" style="font-size: 11px; width: 14px; text-align: center;"></i>
          <span>Cerrar Sesión</span>
        </a>
      </div>
    </div>
</div>

<!-- MAIN WORKSPACE -->
<div class="main" [style.marginLeft]="sidebarCollapsed() ? '0px' : 'var(--sidebar)'">
  <div class="page-header" style="border-bottom: 1px solid var(--border); padding-bottom: 20px;">
    <div>
      <h1 class="page-title">{{ labels().title }}</h1>
      <p class="page-sub">{{ labels().desc }}</p>
    </div>
  </div>

  <div style="margin-top: 40px; display: flex; align-items: center; justify-content: center; height: 300px; border: 1.5px dashed var(--border); border-radius: var(--r); color: var(--muted); font-size: 13px; font-style: italic;">
    Área en blanco lista para diseñar.
  </div>
</div>



<!-- Modal de Identidad/Onboarding -->
<app-identity-settings *ngIf="!membership.onboardingCompleted() || membership.showSettingsModal()" [onboardingMode]="!membership.onboardingCompleted()"></app-identity-settings>
